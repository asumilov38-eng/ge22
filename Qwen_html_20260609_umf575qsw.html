<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Практическая работа №1 — Описание стран</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #0f0f0f;
    color: #e0e0e0;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .header {
    text-align: center;
    padding: 30px 20px 10px;
  }

  .header h1 {
    font-size: 1.4rem;
    font-weight: 300;
    letter-spacing: 2px;
    color: #fff;
  }

  .header p {
    font-size: 0.85rem;
    color: #888;
    margin-top: 6px;
  }

  .tabs {
    display: flex;
    justify-content: center;
    gap: 8px;
    padding: 20px;
    flex-wrap: wrap;
  }

  .tab {
    padding: 10px 22px;
    border: 1px solid #333;
    border-radius: 30px;
    background: transparent;
    color: #aaa;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.3s;
  }

  .tab:hover { border-color: #666; color: #fff; }
  .tab.active {
    background: #fff;
    color: #0f0f0f;
    border-color: #fff;
  }

  .slide-container {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 20px 40px;
  }

  .slide {
    display: none;
    animation: fadeIn 0.4s ease;
  }

  .slide.active { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .slide-number {
    font-size: 0.75rem;
    color: #555;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .slide-title {
    font-size: 1.4rem;
    font-weight: 400;
    color: #fff;
    margin-bottom: 25px;
    padding-bottom: 15px;
    border-bottom: 2px solid #222;
  }

  .slide-content {
    font-size: 0.95rem;
    line-height: 1.8;
    color: #bbb;
  }

  .slide-content p {
    margin-bottom: 15px;
  }

  .slide-content ul {
    list-style: none;
    padding: 0;
    margin-bottom: 15px;
  }

  .slide-content ul li {
    padding: 8px 0 8px 20px;
    position: relative;
    border-bottom: 1px solid #1a1a1a;
  }

  .slide-content ul li::before {
    content: '—';
    position: absolute;
    left: 0;
    color: #555;
  }

  .slide-content .highlight {
    color: #fff;
    font-weight: 600;
  }

  .slide-content .data {
    color: #888;
    font-size: 0.9rem;
  }

  .info-block {
    background: #1a1a1a;
    border-left: 3px solid #333;
    padding: 15px 20px;
    margin: 20px 0;
    border-radius: 0 8px 8px 0;
  }

  .info-block h4 {
    color: #fff;
    margin-bottom: 10px;
    font-size: 1.05rem;
  }

  .two-columns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin: 20px 0;
  }

  @media (max-width: 768px) {
    .two-columns {
      grid-template-columns: 1fr;
    }
  }

  .tag {
    display: inline-block;
    background: #252525;
    padding: 4px 12px;
    border-radius: 4px;
    font-size: 0.85rem;
    margin: 3px 6px 3px 0;
    color: #ccc;
    border: 1px solid #333;
  }

  .nav {
    display: flex;
    justify-content: center;
    gap: 16px;
    padding: 20px;
    position: sticky;
    bottom: 0;
    background: linear-gradient(transparent, #0f0f0f 40%);
  }

  .nav-btn {
    padding: 12px 28px;
    border: 1px solid #333;
    border-radius: 30px;
    background: transparent;
    color: #aaa;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.3s;
  }

  .nav-btn:hover { border-color: #fff; color: #fff; }
  .nav-btn:disabled { opacity: 0.3; cursor: default; }

  .progress {
    text-align: center;
    font-size: 0.75rem;
    color: #444;
    padding-bottom: 10px;
  }

  .country-flag {
    font-size: 2.5rem;
    margin-bottom: 10px;
  }

  .stat-row {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid #222;
  }

  .stat-label {
    color: #888;
  }

  .stat-value {
    color: #fff;
    font-weight: 500;
  }
</style>
</head>

let currentCountry = 'argentina';
let currentSlide = 0;

function renderTabs() {
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  Object.keys(countries).forEach(key => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (key === currentCountry ? ' active' : '');
    btn.textContent = countries[key].flag + ' ' + countries[key].name;
    btn.onclick = () => { currentCountry = key; currentSlide = 0; renderAll(); };
    tabsEl.appendChild(btn);
  });
}

function renderSlides() {
  const container = document.getElementById('slideContainer');
  const c = countries[currentCountry];
  container.innerHTML = '';
  c.slides.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'slide' + (i === currentSlide ? ' active' : '');
    div.innerHTML = `
      <div class="country-flag">${c.flag}</div>
      <div class="slide-number">${c.name} · слайд ${i + 1} из ${c.slides.length}</div>
      <div class="slide-title">${s.title}</div>
      <div class="slide-content">${s.content}</div>
    `;
    container.appendChild(div);
  });
}

function updateProgress() {
  const c = countries[currentCountry];
  document.getElementById('progress').textContent =
    `${currentSlide + 1} / ${c.slides.length}`;
  document.getElementById('prevBtn').disabled = currentSlide === 0;
  document.getElementById('nextBtn').disabled = currentSlide === c.slides.length - 1;
}

function changeSlide(dir) {
  const c = countries[currentCountry];
  const next = currentSlide + dir;
  if (next >= 0 && next < c.slides.length) {
    currentSlide = next;
    renderSlides();
    updateProgress();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function renderAll() {
  renderTabs();
  renderSlides();
  updateProgress();
}

renderAll();
</script>
